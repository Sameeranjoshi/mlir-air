# CSL CI — MLIR lit tests (Tier 1) only.
#
# Runs on every PR targeting main/air-to-fire and on pushes to air-to-fire.
# Builds the project from source on a stock Linux runner; no Cerebras SDK
# required at this tier.
#
# Tier 2 (simulator sweep against real Cerebras hardware via cslc +
# cs_python) is NOT run in CI.  Developers run it locally via the
# pre-push hook — see .githooks/pre-push and utils/run_csl_ci.sh.
# When a self-hosted runner with the Cerebras SDK is available, add a
# second job that invokes `utils/run_csl_ci.sh --no-build -j 8`.

name: CSL CI

on:
  pull_request:
    branches: [main, air-to-fire]
  push:
    branches: [air-to-fire]

jobs:
  csl-lit:
    name: CSL lit tests (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v3
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Configure + build
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DLLVM_INSTALL_DIR=/opt/llvm-install \
            -DAIR_ENABLE_AIE=OFF \
            -DCMAKE_BUILD_TYPE=Release
          ninja install

      - name: Run CSL lit suite
        run: bash utils/run_csl_ci.sh --no-build --fast
