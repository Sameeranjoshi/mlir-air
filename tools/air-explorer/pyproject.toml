[project]
name = "air-explorer"
version = "0.1.0"
description = "Model Explorer adapter for AIR ACDG dependency graphs"
requires-python = ">=3.10"
dependencies = [
  "ai-edge-model-explorer",
  "pydot",
]

[project.entry-points."model_explorer_adapter"]
air_explorer = "air_explorer.main:AIRExplorerAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_explorer"]
